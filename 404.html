<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found | ScholarHub</title>

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">


    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#fff8f2,#ffffff);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:#333;
}


.error-card{
    background:#fff;
    width:100%;
    max-width:700px;
    text-align:center;
    padding:60px 40px;
    border-radius:25px;
    box-shadow:0 20px 45px rgba(0,0,0,.08);
}


.logo img{
    width:180px;
    margin-bottom:30px;
}

.error-number{
    font-size:110px;
    font-weight:800;
    color:#ff6b00;
    line-height:1;
}


.error-title{
    font-size:34px;
    margin-top:15px;
    margin-bottom:20px;
    color:#222;
}

.error-text{
    font-size:17px;
    color:#666;
    max-width:520px;
    margin:0 auto 35px;
}

.button-group{
    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
}

.btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    padding:14px 28px;
    border-radius:50px;
    font-weight:600;
    transition:.3s ease;
}

.btn-home{
    background:#ff6b00;
    color:#fff;
}

.btn-home:hover{
    background:#e55d00;
    transform:translateY(-3px);
}


@media(max-width:768px){

    .error-card{
        padding:45px 25px;
    }

    .logo img{
        width:150px;
    }

    .error-number{
        font-size:85px;
    }

    .error-title{
        font-size:28px;
    }

}

@media(max-width:480px){

    .logo img{
        width:130px;
    }

    .error-number{
        font-size:70px;
    }

    .error-title{
        font-size:24px;
    }

    .error-text{
        font-size:15px;
    }

    .btn{
        width:100%;
        justify-content:center;
    }

}

</style>

</head>

<body>

<div class="error-card">

    <a href="index.html" class="logo">
        <img src="images/logo.png" alt="ScholarHub Logo">
    </a>

    <h1 class="error-number">404</h1>

    <h2 class="error-title">
        Oops! Page Not Found
    </h2>

    <p class="error-text">
        The page you're looking for may have been moved, deleted,
        or the link you followed is incorrect.
        Let's get you back to learning on ScholarHub.
    </p>

    <div class="button-group">

        <a href="index.html" class="btn btn-home">
            <i class="fa-solid fa-house"></i>
            Back to Home
        </a>

    </div>

</div>

</body>
</html>
